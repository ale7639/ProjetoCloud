spring.application.name=biblioteca

server.port=${SERVER_PORT:8080}

#datasource
spring.datasource.url=jdbc:h2:mem:banco
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

#JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

#h2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret via variável de ambiente (nunca versionar segredo real).
# Em desenvolvimento local, o valor abaixo é apenas um fallback didático.
api.security.token.secret=${JWT_SECRET:minha-chave-secreta-deve-ter-256-bits-aqui!!}
